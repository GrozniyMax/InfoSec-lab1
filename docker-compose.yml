services:
  postgres:
    image: postgres:16
    container_name: lab1-postgres
    environment:
      POSTGRES_DB: lab1
      POSTGRES_USER: lab1
      POSTGRES_PASSWORD: lab1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab1 -d lab1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: